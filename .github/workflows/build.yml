name: Build

on:
  workflow_dispatch:
  push:
    branches: [perf/windows-ios]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9
  SING_BOX_VERSION: 1.14.4

jobs:
  core:
    # Checks the generated configuration and the decryption chain against a real sing-box
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install sing-box
        run: |
          name="sing-box-$SING_BOX_VERSION-linux-amd64"
          curl -fsSL --retry 3 -o sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/$name.tar.gz"
          tar -xzf sing-box.tar.gz
          echo "SING_BOX_BIN=$PWD/$name/sing-box" >> "$GITHUB_ENV"
      - run: bash tool/fetch_rule_sets.sh assets/rules
      - name: Run core tests
        env:
          CORE_CONFIG_OUT: build/core-config
        run: flutter test test/core
      - name: Check generated configuration
        run: |
          cd build/core-config
          cp -r ../../assets/rules rules
          for config in *.json; do
            echo "checking $config"
            "$SING_BOX_BIN" check -c "$config"
          done

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash tool/fetch_rule_sets.sh assets/rules
      - name: Restore Libbox
        id: libbox
        uses: actions/cache@v4
        with:
          path: ios/Libbox/Libbox.xcframework
          key: libbox-${{ env.SING_BOX_VERSION }}-${{ hashFiles('tool/build_libbox.sh') }}
      - uses: actions/setup-go@v5
        if: steps.libbox.outputs.cache-hit != 'true'
        with:
          go-version: '1.25'
          cache: false
      - name: Build Libbox
        if: steps.libbox.outputs.cache-hit != 'true'
        run: bash tool/build_libbox.sh "$SING_BOX_VERSION" ios/Libbox
      - name: Build without signing
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry ../RsProxy-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RsProxy-ios-unsigned
          path: build/RsProxy-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  windows:
    # permission_handler_windows 0.2.2 builds with /await, which MSVC 14.51 removed
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash tool/fetch_rule_sets.sh assets/rules
        shell: bash
      - name: Build
        run: flutter build windows --release
      - name: Add sing-box
        shell: bash
        run: |
          name="sing-box-$SING_BOX_VERSION-windows-amd64"
          curl -fsSL --retry 3 -o sing-box.zip "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/$name.zip"
          unzip -q sing-box.zip
          cp "$name/sing-box.exe" build/windows/x64/runner/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: RsProxy-windows-x64
          path: build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 30
