name: Build

on:
  workflow_dispatch:
  push:
    branches: [perf/windows-ios]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build without signing
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry ../ProxyPin-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ProxyPin-ios-unsigned
          path: build/ProxyPin-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  windows:
    # permission_handler_windows 0.2.2 builds with /await, which MSVC 14.51 removed
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: ProxyPin-windows-x64
          path: build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 30
