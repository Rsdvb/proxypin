name: TestFlight

# Signs with an App Store Connect API key and uploads to TestFlight, so nothing here
# needs a Mac at hand. ios/fastlane/Fastfile does the signing and says what has to be
# set up on Apple's side first.
#
# Repository secrets:
#   APPLE_TEAM_ID         Team ID from the Membership page
#   ASC_KEY_ID            API key ID
#   ASC_ISSUER_ID         Issuer ID
#   ASC_KEY_P8            Contents of the .p8 file
#
# Runs on a testflight-* tag: a manual trigger only works for workflows on the default
# branch, and this one lives on a feature branch.
on:
  workflow_dispatch:
  push:
    tags: ['testflight-*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9
  SING_BOX_VERSION: 1.14.4

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check the secrets are set
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::missing secret $name"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash tool/fetch_rule_sets.sh assets/rules
      - name: Restore Libbox
        id: libbox
        uses: actions/cache/restore@v4
        with:
          path: ios/Libbox/Libbox.xcframework
          key: libbox-${{ env.SING_BOX_VERSION }}-${{ hashFiles('tool/build_libbox.sh') }}
      - uses: actions/setup-go@v5
        if: steps.libbox.outputs.cache-hit != 'true'
        with:
          go-version: '1.25'
          cache: false
      - name: Build Libbox
        if: steps.libbox.outputs.cache-hit != 'true'
        run: bash tool/build_libbox.sh "$SING_BOX_VERSION" ios/Libbox
      - name: Save Libbox
        if: steps.libbox.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/Libbox/Libbox.xcframework
          key: libbox-${{ env.SING_BOX_VERSION }}-${{ hashFiles('tool/build_libbox.sh') }}
      - name: Prepare the Xcode project
        # Each upload needs a build number App Store Connect has not seen
        run: flutter build ios --release --config-only --build-number="$GITHUB_RUN_NUMBER"
      - name: Install pods
        run: pod install --project-directory=ios
      - name: Sign, build and upload
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          # The default three seconds is too short for this workspace on a runner
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '180'
          FASTLANE_XCODE_LIST_TIMEOUT: '180'
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          source Flutter/flutter_export_environment.sh
          fastlane beta
      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gym-logs
          path: ~/Library/Logs/gym
          if-no-files-found: ignore
          retention-days: 7
